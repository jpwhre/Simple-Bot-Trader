name: build-native

# Build native installers on every release tag: Windows setup.exe (Inno) and
# macOS .app + dmg. Linux uses the .deb built by tools/build_deb.sh on an
# Ubuntu/Mint host. No code-signing cert (accepted warning). Artifacts are
# attached to the matching GitHub release as additional signed-by-digest assets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reports token comes from an Actions SECRET, never from the repo. It is
      # injected into the checkout before PyInstaller, so installers carry it
      # while the public source stays token-free. Fail closed on releases.
      - name: Embed report transport token (CI secret)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          tok = os.environ.get('REPORTS_TOKEN', '')
          if not tok:
              raise SystemExit('[FAIL] secrets.REPORTS_TOKEN unset - reporting would ship disabled')
          p = pathlib.Path('sbt/report_transport.py')
          s = p.read_text()
          pat = re.compile(r"REPORTS_TOKEN = os\.environ\.get\('SBT_REPORTS_TOKEN', ''\)")
          assert pat.search(s), 'REPORTS_TOKEN placeholder not found'
          s = pat.sub("REPORTS_TOKEN = '" + tok + "'", s, count=1)
          p.write_text(s)
          print('[OK] report token embedded in build source (len=%d)' % len(tok))
          PY

      - name: Install deps + pyinstaller
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build binary (PyInstaller, windowed)
        run: python -m PyInstaller --noconfirm --clean --windowed --name simple-bot-trader --hidden-import=websocket --hidden-import=ccxt main.py

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          if (-not $ver) { $ver = "0.0.0" }
          $iss = @"
          [Setup]
          AppName=Simple Bot Trader
          AppVersion=$ver
          DefaultDirName={localappdata}\Programs\SimpleBotTrader
          DefaultGroupName=Simple Bot Trader
          UninstallDisplayIcon={app}\simple-bot-trader.exe
          OutputBaseFilename=SimpleBotTrader-Setup-$ver
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          [Files]
          Source: "dist\simple-bot-trader\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autodesktop}\Simple Bot Trader"; Filename: "{app}\simple-bot-trader.exe"; IconFilename: "{app}\_internal\sbt\ui\styles\icon.png"
          Name: "{autoprograms}\Simple Bot Trader"; Filename: "{app}\simple-bot-trader.exe"; IconFilename: "{app}\_internal\sbt\ui\styles\icon.png"
          Name: "{autoprograms}\Uninstall Simple Bot Trader"; Filename: "{uninstallexe}"
          [Run]
          Filename: "{app}\simple-bot-trader.exe"; Description: "Launch Simple Bot Trader"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss
          $iscc = "${env:PROGRAMFILES(X86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp installer.iss
          Get-ChildItem Output\*.exe | Copy-Item -Destination dist\
          Copy-Item dist\SimpleBotTrader-Setup-$ver.exe dist\SimpleBotTrader-Setup.exe

      - name: Build macOS dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Simple Bot Trader" -srcfolder dist/simple-bot-trader.app \
            -ov -format UDZO dist/SimpleBotTrader-${{ github.ref_name }}.dmg
          cp dist/SimpleBotTrader-${{ github.ref_name }}.dmg dist/SimpleBotTrader.dmg

      - name: Build Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          ver="${{ github.ref_name }}"; ver="${ver#v}"; [ -n "$ver" ] || ver="0.0.0"
          ROOT=/tmp/pkgs
          rm -rf "$ROOT"; mkdir -p "$ROOT/opt/simple-bot-trader" \
            "$ROOT/usr/share/applications" \
            "$ROOT/usr/share/icons/hicolor/256x256/apps" "$ROOT/DEBIAN"
          cp -a dist/simple-bot-trader/. "$ROOT/opt/simple-bot-trader/"
          # PyInstaller does NOT bundle runtime data (qss/icons). Ship the
          # styles dir explicitly so the deb-installed app renders + has an icon.
          mkdir -p "$ROOT/opt/simple-bot-trader/sbt/ui/styles"
          cp -a sbt/ui/styles/. "$ROOT/opt/simple-bot-trader/sbt/ui/styles/"
          ICON="$ROOT/opt/simple-bot-trader/sbt/ui/styles/icon.png"
          [ -f "$ICON" ] || { echo '[FAIL] icon.png missing from styles dir'; exit 2; }
          cp "$ICON" "$ROOT/usr/share/icons/hicolor/256x256/apps/simple-bot-trader.png"
          # Launch wrapper: force CPU/software rendering for Qt. PyInstaller
          # Qt5 bundles segfault on some Mesa/driver combos (Ubuntu 26 + mesa
          # 26.x, llvmpipe/radeonsi) during large repaints (e.g. theme change
          # in Settings). Software OpenGL is invisible for a desktop bot GUI
          # and sidesteps driver-native crashes entirely.
          cat > "$ROOT/opt/simple-bot-trader/simple-bot-trader.sh" <<'WRAP'
          #!/usr/bin/env bash
          export QT_OPENGL=software
          export LIBGL_ALWAYS_SOFTWARE=1
          exec /opt/simple-bot-trader/simple-bot-trader "$@"
          WRAP
          chmod 755 "$ROOT/opt/simple-bot-trader/simple-bot-trader.sh"
          cat > "$ROOT/usr/share/applications/simple-bot-trader.desktop" <<'DESK'
          [Desktop Entry]
          Version=1.0
          Name=Simple Bot Trader
          GenericName=Cryptocurrency Trading Bot
          Comment=Cryptocurrency trading bot
          Exec=/opt/simple-bot-trader/simple-bot-trader.sh
          Icon=simple-bot-trader
          Terminal=false
          Type=Application
          StartupNotify=true
          Categories=Finance;Office;Network;
          Keywords=crypto;trading;bot;
          DESK
          cat > "$ROOT/DEBIAN/control" <<CNTL
          Package: simple-bot-trader
          Version: $ver
          Section: finance
          Priority: optional
          Architecture: amd64
          Maintainer: jpwhre <jpwhre@users.noreply.github.com>
          Description: Cryptocurrency dip/trailing/DCA trading bot
           Never-take-a-loss crypto trading bot: dip-buy, trailing stop, DCA exit,
           fee-adjusted output, auto-updates. Self-contained Python bundle.
          Depends: libxcb-cursor0, libxkbcommon-x11-0
          CNTL
          cat > "$ROOT/DEBIAN/postinst" <<'POST'
          #!/bin/sh
          set -e
          [ -x /usr/bin/update-desktop-database ] && update-desktop-database >/dev/null 2>&1 || true
          [ -x /usr/bin/gtk-update-icon-cache ] && gtk-update-icon-cache -f /usr/share/icons/hicolor >/dev/null 2>&1 || true
          exit 0
          POST
          chmod 755 "$ROOT/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$ROOT" "dist/SimpleBotTrader-${{ github.ref_name }}.deb"
          cp "dist/SimpleBotTrader-${{ github.ref_name }}.deb" dist/SimpleBotTrader.deb
          ls -la dist/ | grep '\.deb'

      - name: Upload artifact to the release (versioned + stable names)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in dist/SimpleBotTrader-* dist/SimpleBotTrader.dmg dist/SimpleBotTrader.deb; do
            [ -f "$f" ] || continue
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
          gh release edit "${{ github.ref_name }}" --draft=false
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash